name: Build Piano LED Visualizer Image

on:
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Set up QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

    - name: Download base image
      run: |
        wget https://downloads.raspberrypi.com/raspios_lite_armhf/images/raspios_lite_armhf-2024-11-19/2024-11-19-raspios-bookworm-armhf-lite.img.xz
        unxz 2024-11-19-raspios-bookworm-armhf-lite.img.xz
        mv 2024-11-19-raspios-bookworm-armhf-lite.img raspi.img

    - name: Prepare image
      run: |
        # Expand image by 1GB
        dd if=/dev/zero bs=1G count=1 >> raspi.img
        sudo losetup -fP raspi.img
        LOOPDEV=$(sudo losetup -j raspi.img | cut -d: -f1)
        echo "LOOPDEV=$LOOPDEV" >> "$GITHUB_ENV"
        sudo parted $LOOPDEV resizepart 2 100%
        sudo e2fsck -y -f ${LOOPDEV}p2  # Added "-y" for auto-repair
        
        sudo resize2fs ${LOOPDEV}p2

    - name: Mount image
      run: |
        mkdir -p rootfs
        sudo mount ${LOOPDEV}p2 rootfs
        sudo mount ${LOOPDEV}p1 rootfs/boot

    - name: Basic configuration
      run: |
        # Set hostname
        echo "pianoledvisualizer" | sudo tee rootfs/etc/hostname
        sudo sed -i -E 's/^(127\.0\.1\.1\s+).*/\1pianoledvisualizer/' rootfs/etc/hosts

        # Create user
        sudo chroot rootfs useradd -m -G sudo,audio,video,input,render,plugdev,dialout,netdev,spi,i2c,gpio -s /bin/bash plv
        echo "plv:visualizer" | sudo chroot rootfs chpasswd
        echo "plv ALL=(ALL) NOPASSWD: ALL" | sudo tee rootfs/etc/sudoers.d/010_pi-nopasswd
        sudo chmod 0440 rootfs/etc/sudoers.d/010_pi-nopasswd

        # Remove pi user
        sudo chroot rootfs userdel -r pi

    - name: Install dependencies
      run: |
        sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
        sudo mount -t proc /proc rootfs/proc
        sudo mount -t sysfs /sys rootfs/sys
        sudo mount -o bind /dev rootfs/dev

        sudo chroot rootfs /bin/bash -c " \
          apt-get update && \
          apt-get upgrade -y && \
          apt-get install -y git wget python3-pip libopenblas-dev \
            libatlas-base-dev libavahi-client-dev libasound2-dev \
            libusb-dev libdbus-1-dev libglib2.0-dev libudev-dev \
            libical-dev libreadline-dev fonts-freefont-ttf \
            libopenjp2-7 libtiff6 libjack0 libjack-dev autoconf \
            libtool make gcc build-essential scons swig abcmidi iw && \
          systemctl enable ssh && \
          apt-get clean && \
          rm -rf /var/lib/apt/lists/*"

    - name: Install RTP-MIDI
      run: |
        sudo chroot rootfs /bin/bash -c " \
          cd /tmp && \
          wget https://github.com/davidmoreno/rtpmidid/releases/download/v24.12/rtpmidid_24.12.2_armhf.deb && \
          dpkg -i rtpmidid_24.12.2_armhf.deb && \
          apt -f install -y && \
          systemctl enable rtpmidid && \
          rm rtpmidid_24.12.2_armhf.deb"

    - name: Configure system
      run: |
        # Disable audio
        sudo sed -i 's/dtparam=audio=on/#dtparam=audio=on/' rootfs/boot/config.txt
        echo "blacklist snd_bcm2835" | sudo tee rootfs/etc/modprobe.d/snd-blacklist.conf

        # Enable SPI
        echo "dtparam=spi=on" | sudo tee -a rootfs/boot/config.txt

        # Create autoconnect script
        sudo cp -v connectall.py rootfs/usr/local/bin/connectall.py
        sudo chmod +x rootfs/usr/local/bin/connectall.py

    - name: Install Piano LED Visualizer
      run: |
        sudo chroot rootfs /bin/bash -c " \
          git clone --branch master https://github.com/GoulagmanYt/Piano-LED-Visualizer.git /home/Piano-LED-Visualizer && \
          git -C /home/Piano-LED-Visualizer config --local pull.ff only && \
          git -C /home/Piano-LED-Visualizer config --local core.filemode false && \
          chown -R plv:plv /home/Piano-LED-Visualizer && \
          pip3 install -r /home/Piano-LED-Visualizer/requirements.txt --break-system-packages"

        # Configure service
        echo "[Unit]
        Description=Piano LED Visualizer
        After=network-online.target
        Wants=network-online.target
        
        [Install]
        WantedBy=multi-user.target
        
        [Service]
        WorkingDirectory=/home/Piano-LED-Visualizer/
        ExecStart=/usr/bin/python3 /home/Piano-LED-Visualizer/visualizer.py
        Restart=always
        Type=simple
        User=root
        Group=root" | sudo tee rootfs/etc/systemd/system/visualizer.service

        sudo mkdir -p rootfs/etc/systemd/system/rtpmidid.service.d
        cat <<'EOF' | sudo tee rootfs/etc/systemd/system/rtpmidid.service.d/override.conf
        [Service]
        Restart=always
        RestartSec=2
        EOF

        sudo mkdir -p rootfs/etc/NetworkManager/conf.d
        cat <<'EOF' | sudo tee rootfs/etc/NetworkManager/conf.d/30-wifi-powersave-off.conf
        [connection]
        wifi.powersave=2
        EOF

        cat <<'EOF' | sudo tee rootfs/usr/local/sbin/plv-lowlatency-apply.sh
        #!/usr/bin/env bash
        set -u

        for governor in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
          [ -e "$governor" ] || continue
          dir=$(dirname "$governor")
          available=$(cat "$dir/scaling_available_governors" 2>/dev/null || true)
          if echo "$available" | grep -qw ondemand; then
            echo ondemand > "$governor" 2>/dev/null || true
          elif echo "$available" | grep -qw schedutil; then
            echo schedutil > "$governor" 2>/dev/null || true
          fi
        done

        if command -v iw >/dev/null 2>&1; then
          for iface in $(iw dev 2>/dev/null | awk '$1 == "Interface" {print $2}'); do
            iw dev "$iface" set power_save off 2>/dev/null || true
          done
        fi

        if command -v vcgencmd >/dev/null 2>&1; then
          vcgencmd get_throttled || true
        fi
        EOF
        sudo chmod 0755 rootfs/usr/local/sbin/plv-lowlatency-apply.sh

        cat <<'EOF' | sudo tee rootfs/etc/systemd/system/plv-lowlatency.service
        [Unit]
        Description=Piano LED Visualizer low-latency tuning
        After=NetworkManager.service wpa_supplicant.service
        Before=visualizer.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/plv-lowlatency-apply.sh
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF

        sudo mkdir -p rootfs/etc/systemd/system/visualizer.service.d
        cat <<'EOF' | sudo tee rootfs/etc/systemd/system/visualizer.service.d/override.conf
        [Unit]
        After=network-online.target plv-lowlatency.service
        Wants=network-online.target plv-lowlatency.service

        [Service]
        WorkingDirectory=/home/Piano-LED-Visualizer/
        ExecStart=
        ExecStart=/usr/bin/python3 /home/Piano-LED-Visualizer/visualizer.py
        Restart=always
        RestartSec=1
        User=root
        Group=root
        SupplementaryGroups=audio gpio spi i2c video input render
        UMask=0002
        Nice=-10
        IOSchedulingClass=realtime
        IOSchedulingPriority=0
        CPUSchedulingPolicy=rr
        CPUSchedulingPriority=5
        LimitRTPRIO=10
        LimitNICE=-10
        LimitMEMLOCK=64M
        EOF

        sudo chroot rootfs systemctl enable visualizer.service
        sudo chroot rootfs systemctl enable plv-lowlatency.service

    - name: Clean up
      run: |
        sudo umount rootfs/dev
        sudo umount rootfs/sys
        sudo umount rootfs/proc
        sudo umount rootfs/boot
        sudo umount rootfs
        sudo losetup -d $LOOPDEV

    - name: Shrink image
      run: |
        wget https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh
        chmod +x pishrink.sh
        sudo ./pishrink.sh -z raspi.img plv.img

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: plv
        path: plv.img
