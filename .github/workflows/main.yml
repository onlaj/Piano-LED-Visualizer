name: Build Piano LED Visualizer Image

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        type: choice
        options: [armhf, arm64]
        default: armhf
      with_rtpmidi:
        description: "Install rtpmidid (arm64 only; armhf compiles from source and is very slow)"
        type: boolean
        default: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support parted \
            e2fsprogs xz-utils wget coreutils
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      # The whole build runs in one script, so the loop device and mounts stay
      # alive across every step of the install. Splitting it into separate
      # `run:` blocks would drop them, which is why the previous version of this
      # workflow could not work.
      - name: Build image
        run: |
          sudo tools/build_image.sh \
            --arch "${{ inputs.arch }}" \
            --source local \
            ${{ inputs.with_rtpmidi && '--with-rtpmidi' || '--without-rtpmidi' }} \
            --out build

      - name: List output
        run: ls -lh build/*.img* 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoLEDVisualizer-${{ inputs.arch }}
          path: build/*.img.xz
          if-no-files-found: error
